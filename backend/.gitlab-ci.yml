stages:
    - test
    - secret-detection
    - build
    - lint
    - docker-build
    - deploy

variables:
    SECRET_DETECTION_ENABLED: 'true'
    DEPLOY_DIR: '/home/maciej/docker/apps/planner/backend'
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""

secret_detection:
    stage: secret-detection
include:
    -   template: Security/Secret-Detection.gitlab-ci.yml

php-cs-fixer:
    stage: test
    image: composer:2.9.4
    script:
        - composer install --no-interaction --prefer-dist --ignore-platform-req=ext-gd
        - vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff --verbose
    cache:
        paths:
            - vendor/
    except:
        - main

phpunit:
    stage: test
    image: composer:2.9.4
    script:
        - composer install --no-interaction --prefer-dist --ignore-platform-req=ext-gd
        - pecl install pcov && docker-php-ext-enable pcov
        - vendor/bin/phpunit --coverage-text --coverage-cobertura=coverage.xml
    coverage: '/Lines:\s+(\d+\.\d+)%/'
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
    cache:
        paths:
            - vendor/
    except:
        - main

composer:
    stage: build
    image: composer:2.9.4
    script:
        - composer install --no-interaction --prefer-dist --ignore-platform-req=ext-gd
    artifacts:
        paths:
            - vendor/
    cache:
        paths:
            - vendor/
    except:
        - main

lint:
    stage: lint
    image: composer:2.9.4
    needs:
        - composer
    script:
        - composer validate
        - php bin/console lint:yaml config/
        - php bin/console lint:container
    except:
        - main

docker-build:
    stage: docker-build
    image: docker:latest
    tags:
        - docker
    script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        - docker build -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -f docker/php/Dockerfile.prod .
        - docker push $CI_REGISTRY_IMAGE:latest
        - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    only:
        - main

deploy-production:
    stage: deploy
    image: docker:latest
    tags:
        - docker
    before_script:
        - apk add --no-cache docker-compose
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    script:
        - cd $DEPLOY_DIR
        - cp $CI_PROJECT_DIR/docker-compose.prod.yaml $DEPLOY_DIR/
        - docker compose -f docker-compose.prod.yaml pull
        - docker compose -f docker-compose.prod.yaml down
        - docker compose -f docker-compose.prod.yaml up -d
        - sleep 10
        - docker compose -f docker-compose.prod.yaml exec -T php php bin/console doctrine:migrations:migrate --no-interaction || true
        - docker compose -f docker-compose.prod.yaml exec -T php php bin/console cache:clear --env=prod || true
        - docker compose -f docker-compose.prod.yaml ps
    environment:
        name: production
        url: https://api-planner.msolve.it
    only:
        - main

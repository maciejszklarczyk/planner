App\Entity\User:
    user_admin:
        email: 'admin@example.com'
        password: 'password'
        roles: ['ROLE_ADMIN']
        status: active
        name: 'Admin User'

    user_1:
        email: 'user1@example.com'
        password: 'password'
        roles: ['ROLE_USER']
        status: active
        name: '<firstName()> <lastName()>'

    user_2:
        email: 'user2@example.com'
        password: 'password'
        roles: ['ROLE_USER']
        status: inactive
        name: '<firstName()> <lastName()>'

    user_3:
        email: 'user3@example.com'
        password: 'password'
        roles: ['ROLE_USER']
        status: blocked
        name: '<firstName()> <lastName()>'

    user_4:
        email: 'user4@example.com'
        password: 'password'
        roles: ['ROLE_USER']
        status: deleted
        name: '<firstName()> <lastName()>'

    user_5:
        email: 'user5@example.com'
        password: 'password'
        roles: ['ROLE_USER']
        name: '<firstName()> <lastName()>'

    # Active users reserved for friendship tests (every send needs a reachable addressee).
    # Emails must not contain "user1": UserControllerTest expects `search=user1` to match one user.
    friend_{1..8}:
        email: 'friend<current()>\@example.com'
        password: 'password'
        roles: ['ROLE_USER']
        status: active
        name: '<firstName()> <lastName()>'

nelmio_api_doc:
    documentation:
        host: localhost
        info:
            title: Planner API
            description: API documentation for Planner application
            version: 1.0.0
        tags:
            - name: Authentication
              description: Operacje związane z autoryzacją
            - name: Admin
              description: Endpointy administracyjne (/admin)
            - name: User
              description: Endpointy użytkownika (/user)
            - name: Group
              description: Endpointy grup (/groups)
        paths:
            /auth/login:
                post:
                    tags:
                        - Authentication
                    summary: User login
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    properties:
                                        email:
                                            type: string
                                            format: email
                                        password:
                                            type: string
                                            format: password
                    responses:
                        '200':
                            description: Login successful
                        '401':
                            description: Invalid credentials
            /auth/logout:
                post:
                    tags:
                        - Authentication
                    summary: User logout
                    responses:
                        '200':
                            description: Logout successful
            /auth/me:
                get:
                    tags:
                        - Authentication
                    summary: Get current user information
                    responses:
                        '200':
                            description: User information retrieved
                        '401':
                            description: Not authenticated
    areas:
        default:
            path_patterns:
                - ^/(?!api/doc|_) # All routes except /api/doc and internal routes

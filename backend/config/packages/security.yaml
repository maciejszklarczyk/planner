security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            stateless: false
            entry_point: App\Security\JsonAuthenticationEntryPoint
            json_login:
                check_path: /auth/login
                username_path: email
                password_path: password
            logout:
                path: /auth/logout
            access_denied_handler: App\Security\JsonAccessDeniedHandler

            # Throttle failed login attempts to prevent brute force attacks
            login_throttling:
                max_attempts: 3          # Max 3 failed attempts
                interval: '15 minutes'   # Within 15 minutes
                # Throttles by IP + username combination by default

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/version, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/invitation/verify, roles: PUBLIC_ACCESS }
        - { path: ^/invitation/complete, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@dev:
    security:
        firewalls:
            main:
                custom_authenticators:
                    - App\Security\DevHeaderAuthenticator

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

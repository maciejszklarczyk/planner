services:
  frontend:
    image: ghcr.io/maciejszklarczyk/planner-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: ${PROJECT_NAME:-plan}-frontend
    working_dir: /app
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - zbyszek-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=zbyszek-network"
      - "traefik.http.routers.planner-frontend.rule=Host(`planner.msolve.it`)"
      - "traefik.http.routers.planner-frontend.entrypoints=web"
      - "traefik.http.services.planner-frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  zbyszek-network:
    external: true

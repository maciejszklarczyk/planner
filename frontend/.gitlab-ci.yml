variables:
  DEPLOY_DIR: '/home/maciej/docker/apps/planner/frontend'
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  NEXT_PUBLIC_API_URL: 'https://api-planner.msolve.it'

stages:
  - quality
  - docker-build
  - deploy

quality-checks:
  stage: quality
  image: node:20-alpine
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npx tsc --noEmit
    - npm run test
    - npm run format:check

docker-build:
  stage: docker-build
  image: docker:latest
  tags:
    - docker
  script:
    - cd frontend
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

deploy-production:
  stage: deploy
  image: docker:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache docker-compose
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - cd $DEPLOY_DIR
    - cp $CI_PROJECT_DIR/frontend/docker-compose.prod.yaml $DEPLOY_DIR/
    - docker compose -f docker-compose.prod.yaml pull
    - docker compose -f docker-compose.prod.yaml down
    - docker compose -f docker-compose.prod.yaml up -d
    - sleep 5
    - docker compose -f docker-compose.prod.yaml ps
  environment:
    name: production
    url: https://planner.msolve.it
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.2.3)'
        required: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: ghcr.io/maciejszklarczyk/planner-backend:${{ github.event.release.tag_name || inputs.tag }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: https://api-planner.msolve.it
    env:
      IMAGE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DEPLOY_DIR: /home/maciej/docker/apps/planner/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose file
        run: cp docker-compose.prod.yaml "$DEPLOY_DIR/docker-compose.prod.yaml"
      - name: Deploy (migrate-before-cutover)
        working-directory: /home/maciej/docker/apps/planner/backend
        run: |
          docker compose -f docker-compose.prod.yaml pull
          docker compose -f docker-compose.prod.yaml run --rm php php bin/console doctrine:migrations:migrate --no-interaction
          docker compose -f docker-compose.prod.yaml stop php
          docker compose -f docker-compose.prod.yaml up -d --no-deps php
          docker compose -f docker-compose.prod.yaml exec -T php php bin/console cache:clear --env=prod
          docker compose -f docker-compose.prod.yaml ps
          curl -f https://api-planner.msolve.it/health

name: Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.2.3)'
        required: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-planner.msolve.it
          tags: ghcr.io/maciejszklarczyk/planner-frontend:${{ github.event.release.tag_name || inputs.tag }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://planner.msolve.it
    env:
      IMAGE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DEPLOY_DIR: /home/maciej/docker/stacks/planner/frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync compose file
        run: cp docker-compose.prod.yaml "$DEPLOY_DIR/docker-compose.prod.yaml"
      - name: Deploy
        working-directory: /home/maciej/docker/stacks/planner/frontend
        run: |
          docker compose -f docker-compose.prod.yaml pull
          if docker compose version --short | awk -F. '{exit !($1>2 || ($1==2 && $2>=17))}'; then
            docker compose -f docker-compose.prod.yaml up -d --wait --wait-timeout 60
          else
            docker compose -f docker-compose.prod.yaml up -d
            timeout 60 sh -c 'until curl -sf https://planner.msolve.it/api/health; do sleep 2; done'
          fi
